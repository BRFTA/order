<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BRFTA 주문 등록 시스템">
  <title>BRFTA 주문 등록 시스템</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --wine: #6f1834;
      --wine-dark: #551126;
      --gold: #b28a52;
      --cream: #f8f4ee;
      --paper: #fffdf9;
      --text: #25201f;
      --muted: #766d69;
      --line: #e7ddd5;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #f7f1ea 0%, #fffdf9 48%, #f5f1ed 100%);
      color: var(--text);
      font-family: Arial, "Noto Sans KR", "Malgun Gothic", sans-serif;
    }
    .wrap {
      width: min(100% - 32px, 680px);
      margin: 0 auto;
      padding: 54px 0 42px;
    }
    .brand { text-align: center; margin-bottom: 34px; }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 54px;
      margin-bottom: 14px;
      border: 1px solid rgba(178,138,82,.5);
      border-radius: 50%;
      color: var(--gold);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
      background: rgba(255,255,255,.62);
    }
    h1 { margin: 0; color: var(--wine); font-size: 30px; letter-spacing: -.6px; }
    .brand-name { margin-top: 7px; color: var(--gold); font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    .intro { margin: 16px 0 0; color: var(--muted); font-size: 15px; line-height: 1.65; }
    .choices { display: grid; gap: 14px; }
    .choice {
      display: block;
      position: relative;
      padding: 22px 54px 22px 22px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.92);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 5px 20px rgba(62,39,32,.055);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .choice:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(62,39,32,.09); border-color: #d8c7bb; }
    .choice.primary { border-color: rgba(111,24,52,.34); background: linear-gradient(135deg, #fff 0%, #fff9fa 100%); }
    .number { display: inline-block; margin-bottom: 8px; color: var(--gold); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
    .title { display: block; color: var(--wine); font-size: 20px; font-weight: 800; letter-spacing: -.35px; }
    .desc { display: block; margin-top: 7px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .arrow { position: absolute; right: 22px; top: 50%; transform: translateY(-50%); color: var(--gold); font-size: 25px; }
    .admin-area { margin-top: 46px; padding-top: 25px; border-top: 1px solid var(--line); text-align: center; }
    .admin-note { margin: 0 0 12px; color: #918783; font-size: 12px; }
    .admin-button {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid #cfc5c0;
      border-radius: 8px;
      color: #6f6662;
      background: rgba(255,255,255,.72);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    .footer { margin-top: 28px; text-align: center; color: #aaa09b; font-size: 11px; }
    @media (max-width: 480px) {
      .wrap { width: min(100% - 24px, 680px); padding-top: 38px; }
      h1 { font-size: 27px; }
      .choice { padding: 19px 47px 19px 18px; }
      .title { font-size: 18px; }
      .arrow { right: 17px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">B</div>
      <h1>BRFTA BRFTA 주문 등록 시스템</h1>
      <div class="brand-name">배려프레스코푸르타</div>
      <p class="intro">원하시는 주문 방법을 선택해 주세요.</p>
    </header>

    <section class="choices" aria-label="주문 방법 선택">
      <a class="choice primary" href="./multi/">
        <span class="number">01</span>
        <span class="title">다중배송 입력 시스템</span>
        <span class="desc">여러 배송지를 한 번에 입력하여 주문하실 수 있습니다.</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="choice" href="https://smartstore.naver.com/brfta" target="_blank" rel="noopener noreferrer">
        <span class="number">02</span>
        <span class="title">네이버 스마트스토어</span>
        <span class="desc">일반 주문 및 온라인 결제를 이용하실 수 있습니다.</span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="choice" href="./downloads/로젠택배_다배송_FORM.xlsx" download>
        <span class="number">03</span>
        <span class="title">로젠택배 Excel 양식 다운로드</span>
        <span class="desc">배송지가 많은 경우 Excel 양식을 내려받아 직접 작성하실 수 있습니다.</span>
        <span class="arrow" aria-hidden="true">↓</span>
      </a>
    </section>

    <section class="admin-area">
      <p class="admin-note">BRFTA 관리자 전용</p>
      <a class="admin-button" href="https://brfta-order-admin.brfrescofruta.workers.dev/" target="_blank" rel="noopener noreferrer">🔒 주문관리 시스템</a>
    </section>

    <footer class="footer">BRFTA · FRESH PEARS, SINCERELY YOURS</footer>
  </main>
</body>
</html>
